# ─────────────────────────────────────────────
# tmux.conf — Pastel Powerline
# ─────────────────────────────────────────────

# ── General ──────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g escape-time 10
set -g history-limit 10000
set -g base-index 0
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g focus-events on
set -g set-clipboard on


# ── Prefix ───────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Splits ───────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window inherits path
bind c new-window -c "#{pane_current_path}"

# ── Vim-style pane navigation ────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Prefix-less: opt+hjkl move, opt+HJKL resize (below).
# When the pane is running nvim the key is forwarded instead of consumed, so an
# nvim split boundary and a tmux pane boundary feel identical.
# Other half of the deal: ~/.config/nvim/lua/plugins/tmux-navigator.lua
# Upstream ships this with \S and [^ ]*, both of which macOS's BSD grep gets wrong —
# \S is read as a literal S, and [^ ]*/ refuses to backtrack to empty, so "nvim"
# never matched. (.*/)? is the form BSD actually handles. Verified against ps output
# for nvim/vim/view/gvim/nvimdiff (match) and zsh/claude/python/node/fzf (no match).
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(.*/)?g?(view|l?n?vim?x?)(diff)?$'"
bind-key -n M-h if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
bind-key -n M-j if-shell "$is_vim" 'send-keys M-j' 'select-pane -D'
bind-key -n M-k if-shell "$is_vim" 'send-keys M-k' 'select-pane -U'
bind-key -n M-l if-shell "$is_vim" 'send-keys M-l' 'select-pane -R'

# copy-mode owns its own key table; without these, navigation dies on entering it
bind-key -T copy-mode-vi M-h select-pane -L
bind-key -T copy-mode-vi M-j select-pane -D
bind-key -T copy-mode-vi M-k select-pane -U
bind-key -T copy-mode-vi M-l select-pane -R

# Resize panes (repeatable)
# bind -r -N "Resize pane left"  H resize-pane -L 5
# bind -r -N "Resize pane down"  J resize-pane -D 5
# bind -r -N "Resize pane up"    K resize-pane -U 5
# bind -r -N "Resize pane right" L resize-pane -R 5
bind-key -nr M-H resize-pane -L 1
bind-key -nr M-J resize-pane -D 1
bind-key -nr M-K resize-pane -U 1
bind-key -nr M-L resize-pane -R 1

# Balance the current pane against one neighbour — same width for h/l, same
# height for j/k — leaving every other pane alone. tmux's own even-horizontal
# equalises the whole window, which is a different thing.
#
# M-e rather than the M-b this was first drafted as: M-b and M-B are both
# backward-word in zsh, and -n takes the key before any shell sees it, so
# binding either would lose backward-word in every pane. M-e is undefined-key.
bind-key -n M-e switch-client -T balance
bind-key -T balance h run-shell "~/.tmux/balance.sh L"
bind-key -T balance j run-shell "~/.tmux/balance.sh D"
bind-key -T balance k run-shell "~/.tmux/balance.sh U"
bind-key -T balance l run-shell "~/.tmux/balance.sh R"

# ── Reload config ────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ── Popups ───────────────────────────────────
# M-s: floating scratch shell. Always the *same* session, so it keeps its history
# and whatever you left running in it; the same key inside detaches (= closes).
# Distinct from prefix+* (new-pane), which is a fresh popup every time.
bind-key -n M-s if-shell -F '#{==:#{session_name},_scratch}' \
  'detach-client' \
  'display-popup -d "#{pane_current_path}" -xC -yC -w 70% -h 70% -E "tmux new-session -A -s _scratch"'

# M-o: fzf project picker — attach-or-create one session per directory.
# Was M-f, but a terminal sends M-f for opt+right, which readline/zsh uses for
# forward-word — tmux ate it before the shell saw it. M-o is unbound in both.
bind-key -n M-o display-popup -xC -yC -w 70% -h 60% -E "~/.tmux/sessionizer.sh"

# ── Command cheatsheet ───────────────────────
# Fuzzy-search every tmux command with a live man-page preview.
#   <prefix> F          → open it via keybinding  (f = find-window, F = find-command)
#   <prefix> : cheat    → open it as a typed command (command-alias below)
bind F display-popup -E -w 85% -h 80% "~/.tmux/cheat.sh"
# High index ([100]) appends without clobbering tmux's built-in aliases.
set -s command-alias[100] 'cheat=display-popup -E -w 85% -h 80% "~/.tmux/cheat.sh"'

# <prefix> ? opens this config's own quickstart, mirroring nvim's <leader> ? for
# ~/.nvimcheatsheet.md. It overrides tmux's built-in list-keys, which <prefix> F
# supersedes anyway — that gives the same commands with descriptions and a preview.
# glow if it is installed, bat otherwise: bat is in INSTALL.md, glow is not.
bind ? display-popup -E -w 85% -h 80% \
  "if command -v glow >/dev/null 2>&1; then glow -p ~/.tmux-quickstart.md; \
   else bat --style=plain --paging=always -l md ~/.tmux-quickstart.md; fi"

# ── Palette ──────────────────────────────────
#   bg_deep   #24283b      bar background
#   bg_dark   #1a1b26      ink on the bright segments
#   bg_muted  #3b4261      inactive segments
#   fg_dim    #73b5d4      muted text
#   fg_light  #c0caf5      primary text
#   blue      #7aa2f7      session / accents
#   cyan      #73daca      active window / clock
#   green     #9ece6a      (available for alerts)
#   yellow    #e0af68      command messages

# ── Status bar ───────────────────────────────
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#24283b,fg=#c0caf5"

# Left: session name. The block flips to yellow while the prefix is armed —
# cheapest possible "did C-a register?" feedback.
set -g status-left-length 30
set -g status-left "#[bg=#{?client_prefix,#e0af68,#7aa2f7},fg=#1a1b26,bold]  #S #[bg=#24283b,fg=#{?client_prefix,#e0af68,#7aa2f7}]"

# Right: notice + zoom flag + git + time + date.
# status-tick.sh prints the pending notice, if any, and sweeps a Working whose
# pane has stopped redrawing — see the header of that script. It runs here
# because tmux re-expands status-right on every redraw — status-interval is only
# the floor that guarantees one when nothing else happens. A switch re-runs the
# job within 20ms, but on the pre-switch frame, so a notice clears on the tick
# after you arrive: 2.0s measured here, 5s worst case.
# Zoom is otherwise invisible, which is the whole reason people lose panes.
# Commas inside a #[...] nested in a conditional must be escaped as #,
set -g status-right-length 120
set -g status-right "#(~/.tmux/status-tick.sh)#{?window_zoomed_flag,#[fg=#e0af68#,bg=#24283b]#[fg=#1a1b26#,bg=#e0af68#,bold]  ZOOM #[fg=#e0af68#,bg=#24283b] ,}#[fg=#73b5d4,bg=#24283b]#(~/.tmux/git-status.sh '#{pane_current_path}')#[fg=#73daca,bg=#24283b]#[bg=#73daca,fg=#1a1b26]  %H:%M #[fg=#7aa2f7,bg=#73daca]#[bg=#7aa2f7,fg=#1a1b26]  %b %d "

# ── Tab label (@tab) ─────────────────────────
# Four branches, first match wins. Every one of them is capped at 40 cells; the
# arithmetic is per-branch because the prefixes differ in width, and because
# tmux's '=' modifier charges the ellipsis *outside* the number you give it
# (#{=/10/…:x} yields 11 cells). It counts display cells, not bytes, so CJK and
# combining marks are budgeted correctly.
#
#   nvim    ✎: + last 37  -> 40.  Title comes from ~/.config/nvim/lua/options.lua,
#           which already fits it to 37 and splits the squeeze between repo and
#           filename; =/-37/… here only bites titles we did not write. Must sit
#           ahead of the @ps_state branch or a pane that ran `vim` shows "▶ vim".
#   agent   state word + name -> 40; widths per state in the block below, or a
#           bare 39 + … when no state word is recognised.
#           Claude, Codex and opencode share this branch. The tell differs: Claude
#           panes exec ~/.local/share/claude/versions/<ver>, so pane_current_command
#           is a version string, while Codex's is plainly `codex`. opencode's is
#           `opencode.exe`, measured on 1.18.20 from Homebrew: the formula ships a
#           Bun-compiled binary under that name and `opencode` is the wrapper that
#           execs it, so the wrapper is gone by the time tmux looks. The `.exe` is
#           optional in the pattern because an install from npm or bun need not use
#           it. Must also sit ahead of @ps_state — zsh set that to run when
#           the agent launched and it stays run for the whole session, so the pane
#           would otherwise read "▶ codex".
#   command ✘255 + 34 + … -> 40 worst case (▶/✔ spend 2 of the 5, so 37).
#   idle    first 39 + …  -> 40.  cwd basename, ~ for home.
#
# ── Agent state, one vocabulary for both ─────
# The tab shows "<State> | <name>", in Codex's own words, for both agents:
#
#   Working | name          busy, nothing for you
#   Action Required | name  blocked on you
#   Ready | name            a turn ended and you have not read it
#   name                    nothing pending
#
# For Codex this is close to a passthrough of its own pane title: strip the
# `activity` prefix, keep the rest. For Claude and for opencode the same string is
# synthesised from hooks, because both publish a pane title that never changes —
# Claude's constant "✳ <session>", measured rather than assumed, and opencode's
# constant "OpenCode", which does not even carry the project. That is the whole
# asymmetry, and the reason ~/.tmux/agent-notify.sh is wired to four Claude
# events, two Codex ones, and opencode's whole event bus through the plugin in
# ~/.config/opencode/plugins/tmux-agent.ts.
#
#   Working          Codex: its title. Claude and opencode: @agent_state=working,
#                    from UserPromptSubmit. A live Working title is checked FIRST, so
#                    approving a request fixes the tab at once rather than at the
#                    end of the turn.
#   Action Required  Codex: its title, which says this for an approval and for
#                    nothing else. Claude and opencode: @agent_state=wait, from
#                    PermissionRequest.
#                    Never cleared by visiting the pane — an approval you have
#                    looked at and not answered is still an approval.
#   Ready            @agent_state=ready, from Stop, for ALL THREE. Codex's own
#                    title says Ready for a finished turn and for a pane nobody
#                    has touched since yesterday alike, so the title cannot tell
#                    you a question is waiting. Cleared by visiting the pane, the
#                    same acknowledgement @ps_state's ✔ gets.
#
# Anything else falls through and the remaining title is shown verbatim. A Codex
# run-state we have not seen is already a word, so an untranslated state still
# reads correctly — "Compacting | punto" costs nothing.
#
# Widths add to 40: "Action Required | " is 18 + 21 + …, "Working | " 10 + 29 + …,
# "Ready | " 8 + 31 + …, bare name 39 + …. Codex emits a state at all only if
# [tui].terminal_title carries run-state as its first field — INSTALL.md step 8.
#
# The render lives in @agent_lbl and the "is this an agent pane" test in
# @agent_is, because pane-border-format needs both too. A window tab can only
# ever speak for the active pane, so in a split the other agent would otherwise
# show the border's @ps_cmd — which for an agent pane is frozen at "▶ codex" from
# the moment zsh's preexec saw the launch and never changes again.
set -g @agent_is '#{m/r:^codex$|^opencode(\.exe)?$|^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}}'
# opencode's title is "OpenCode" until you send it anything and "OC | <session>" after
# that, so the session name is there but the project never is. Take the session when there
# is one — it is the thing you renamed with /rename, and it is what the other two agents
# show — and the pane's cwd before then, which is the directory opencode was started in and
# does not move. So the tab reads the directory for a session you have not written to yet,
# and the session name from your first message onward.
# Keyed on the pane's command rather than on the shape of the title alone, because that is
# the same test @agent_is already trusts — and @agent_is also matches Codex and Claude
# panes, which must take the other branch.
set -g @agent_name '#{?#{m/r:^opencode(\.exe)?$,#{pane_current_command}},#{?#{m:OC | *,#{pane_title}},#{s/^OC \| //:#{pane_title}},#{b:pane_current_path}},#{s/^[^|]*(Ready|Working|Action Required) \| //:#{s/^[✳] //:pane_title}}}'
set -g @agent_lbl '#{?#{m/r:^[^|]*Working \|,#{pane_title}},Working | #{=/29/…:#{E:@agent_name}},#{?#{||:#{m/r:^[^|]*Action Required \|,#{pane_title}},#{==:#{@agent_state},wait}},Action Required | #{=/21/…:#{E:@agent_name}},#{?#{==:#{@agent_state},working},Working | #{=/29/…:#{E:@agent_name}},#{?#{==:#{@agent_state},ready},Ready | #{=/31/…:#{E:@agent_name}},#{=/39/…:#{E:@agent_name}}}}}}'
set -g @tab '#{?#{m/r:^(n|g)?vim(diff)?$|^view$,#{pane_current_command}},✎:#{=/-37/…:pane_title},#{?#{E:@agent_is},#{E:@agent_lbl},#{?@ps_state,#{?#{==:#{@ps_state},run},▶,#{?#{==:#{@ps_state},ok},✔,✘#{@ps_code}}} #{=/34/…:@ps_cmd},#{=/39/…:#{?#{==:#{pane_current_path},#{HOME}},~,#{b:pane_current_path}}}}}}'

# Visiting a pane acknowledges its ✔/✘ — back to the idle dir name. Never clears ▶.
# Arrival is not the only acknowledgement: pane-status.zsh's precmd clears the same
# option outright when the command finished in a pane you were already watching,
# which fires no arrival and so used to leave the badge with nothing to clear it.
set-hook -g after-select-pane   'if -F "#{!=:#{@ps_state},run}" "set -pu @ps_state"'
set-hook -g after-select-window 'if -F "#{!=:#{@ps_state},run}" "set -pu @ps_state"'

# Same acknowledgement for an agent's "Ready": visiting the pane means you read
# it. Only `ready` — a pending approval is not acknowledged by looking at it, so
# "Action Required" survives until the agent itself moves on, and so does
# `working`, which is true right up until the turn ends without saying so:
# Claude fires no hook when you interrupt with Esc. status-tick.sh retires that
# one by watching the pane redraw instead.
set-hook -ga after-select-pane   'if -F "#{==:#{@agent_state},ready}" "set -pu @agent_state"'
set-hook -ga after-select-window 'if -F "#{==:#{@agent_state},ready}" "set -pu @agent_state"'

# Arriving by session — `switch-client`, choose-tree, or attaching to a session
# whose current window already holds the pane — fires neither of the two hooks
# above, measured on 3.7c, so a "Ready" you walked into that way used to stay
# until you left the window and came back. These two fire on both.
# -g, not -ga: these two are the first setter for their hook names, and `bind r`
# is a key you press. With -ga each reload appended another copy — the live
# server was at client-attached[4] after one reload.
set-hook -g client-session-changed 'if -F "#{==:#{@agent_state},ready}" "set -pu @agent_state"'
set-hook -g client-attached        'if -F "#{==:#{@agent_state},ready}" "set -pu @agent_state"'

# Window tabs
set -g status-justify left
setw -g window-status-format "#[fg=#24283b,bg=#3b4261]#[fg=#73b5d4,bg=#3b4261] #I  #{E:@tab} #[fg=#3b4261,bg=#24283b]"
setw -g window-status-current-format "#[fg=#24283b,bg=#73daca]#[fg=#1a1b26,bg=#73daca,bold] #I  #{E:@tab} #[fg=#73daca,bg=#24283b]"
setw -g window-status-separator ""

# Active pane marked by contrast, not border colour — a pane's bottom edge is
# owned by the pane-status row of whatever sits below it, so the border lies.
# Border styling lives with the rest of the pane-border block further down.
# Both styles set bg, so no pane shows the terminal's own background any more:
# the active one is your exact terminal colours, inactive is a step darker.
set -g window-style        'fg=#9ab9ad,bg=#00222b'
set -g window-active-style 'fg=#cde8d5,bg=#002b36'

# Messages
set -g message-style "bg=#7aa2f7,fg=#1a1b26,bold"
set -g message-command-style "bg=#e0af68,fg=#1a1b26"

# ── Plugins (TPM) ───────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'laktak/extrakto'

# thumbs — prefix+g overlays hint letters on every path/url/hash/ip on screen;
# press the letter, it's on the clipboard. -w routes through OSC 52, so it also
# works over ssh.
set -g @thumbs-key g
set -g @thumbs-unique enabled
set -g @thumbs-reverse enabled
set -g @thumbs-hint-bg-color '#e0af68'
set -g @thumbs-hint-fg-color '#1a1b26'
set -g @thumbs-select-fg-color '#73daca'
set -g @thumbs-command 'tmux set-buffer -w -- {} && tmux display-message " copied {} "'

# extrakto — prefix+Tab fuzzy-searches every token on screen and in scrollback.
# Enter copies, Tab inserts at the prompt.
set -g @extrakto_key Tab
set -g @extrakto_default_opt word
set -g @extrakto_split_direction p
set -g @extrakto_popup_size '70%,60%'
set -g @extrakto_clip_tool_run fg

set -g pane-border-status top
# @ps_* (from ~/.tmux/pane-status.zsh) persists after the command exits; @last_cmd did not.
# @ps_dur only exists once the command has finished, so ▶ never shows a duration.
set -g pane-border-format '#{?#{E:@agent_is}, #{E:@agent_lbl} ,#{?@ps_cmd, #{?#{==:#{@ps_state},run},▶,#{?#{==:#{@ps_code},0},✔,✘#{@ps_code}}} #{@ps_cmd}#{?@ps_dur,  #{@ps_dur},} ,}}'
set -g pane-border-style 'fg=colour240'
set -g pane-active-border-style 'fg=colour240'
set -g pane-border-lines single
# default "colour" colours only HALF the shared border in 2-pane windows; off = colour all of it
set -g pane-border-indicators off

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'

# Unbind C-arrow resize added by tmux-sensible (keep H/J/K/L only)
unbind C-Left
unbind C-Right
unbind C-Up
unbind C-Down

# window selection with alt
bind-key -n M-0 select-window -t 0
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# prev/next window
bind-key -n 'M-[' previous-window
bind-key -n 'M-]' next-window

# copy mode
bind-key -n 'M-\' copy-mode
